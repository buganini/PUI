name: Publish cookbook and documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Prepare build environment
        run: |
          python3 -m venv env
      - name: Build static site
        run: make pyodide-build
      - name: Check local bridge and import boundary
        run: |
          PYTHONPATH=tests env/bin/python -m unittest -q pyodide_runtime documentation
          node tests/browser_bundle.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pyodide

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
